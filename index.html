<!doctype html>
<html lang="id"><head><meta charset="utf-8">

<title>ARISTA POS - prototipe</title>
<style>
:root{--bg:#f7f1e8;--panel:#ffffff;--line:#e6dccd;--gold:#b5583a;--cream:#2b211a;--muted:#7a6b5d;--warn:#8a3b25}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--cream);font:0.9375rem/1.5 Inter,system-ui,-apple-system,sans-serif}
h1,h2,h3{font-family:"Libre Baskerville",Georgia,serif;font-weight:400;margin:0}
#app{max-width:430px;margin:0 auto;min-height:100vh;padding:14px 16px 96px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.btn{display:block;width:100%;background:var(--gold);color:#ffffff;border:0;border-radius:12px;padding:12px 16px;font-weight:600;font-size:0.9375rem;font-family:inherit;cursor:pointer}
.btn.ghost{background:transparent;color:var(--gold);border:1px solid var(--gold)}
.btn.sm{display:inline-block;width:auto;padding:6px 12px;font-size:0.8125rem}
input{width:100%;background:var(--panel);color:var(--cream);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font:inherit}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.muted{color:var(--muted);font-size:0.8125rem}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tabs{display:flex;gap:6px;overflow-x:auto;flex-wrap:wrap}
.tab{padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);font:inherit;font-size:0.8125rem;white-space:nowrap;cursor:pointer}
.tab.on{background:var(--gold);color:#ffffff;border-color:var(--gold)}
#status{position:sticky;top:0;z-index:5;margin:-14px -16px 12px;padding:8px 16px;font-size:0.8125rem;background:#efe6d8;border-bottom:1px solid var(--line)}
#status.off{color:var(--warn)}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:#ffffff;border-top:1px solid var(--line);display:flex;padding:6px 0 calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;background:none;border:0;color:var(--muted);font:inherit;font-size:0.75rem;padding:6px 0;cursor:pointer}
nav button.on{color:var(--gold)}
.receipt{background:#2b211a;color:#f7f1e8;border-radius:6px;padding:14px;font:0.8125rem/1.6 ui-monospace,Menlo,monospace}
.hidden{display:none!important}
#toast{position:fixed;bottom:86px;left:50%;transform:translateX(-50%);background:var(--gold);color:#ffffff;padding:9px 14px;border-radius:10px;font-size:0.875rem;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;text-align:center}
#toast.show{opacity:1}
@media print{body *{visibility:hidden}.receipt,.receipt *{visibility:visible}.receipt{position:absolute;left:0;top:0;width:80mm}}

body{background:radial-gradient(900px 500px at 50% -120px,rgba(181,88,58,.16),transparent 60%),#f7f1e8}
.card{background:linear-gradient(180deg,#ffffff,#ffffff);border:1px solid rgba(181,88,58,.16);border-radius:18px;box-shadow:0 8px 24px rgba(90,60,30,.12)}
.btn{border-radius:14px;box-shadow:0 6px 18px rgba(181,88,58,.18)}
.btn.ghost{box-shadow:none}
.tab{border-radius:999px;padding:8px 14px}
.pill{display:inline-block;font-size:0.75rem;padding:3px 10px;border-radius:999px;background:rgba(181,88,58,.14);color:var(--gold)}
.avatar{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,#b5583a,#9a4a2e);color:#ffffff;display:flex;align-items:center;justify-content:center;font-family:Georgia,serif;font-size:1.125rem}
.field{display:flex;align-items:center;gap:8px;background:#ffffff;border:1px solid var(--line);border-radius:14px;padding:0 12px;margin-top:12px}
.field input{border:0;background:transparent;padding:13px 0;flex:1;outline:none}
.field svg{width:18px;height:18px;flex:none;color:var(--muted)}
.eye{background:none;border:0;color:var(--muted);padding:6px;cursor:pointer}
.eye svg{width:18px;height:18px}
.auth-logo{padding-top:44px;text-align:center}
.auth-logo h1{font-size:2rem;letter-spacing:.08em}
.auth-logo .cup{width:64px;height:64px;margin:0 auto 10px;color:var(--gold)}
.center{text-align:center}
.link{color:var(--gold);background:none;border:0;font:inherit;font-size:0.875rem;cursor:pointer;margin-top:14px}
.err{min-height:18px;margin-top:8px;color:var(--warn)}
.splash{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px}
.splash .cup{width:84px;height:84px;color:var(--gold)}
.splash h1{font-size:2.125rem;letter-spacing:.1em}
nav{background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-top:1px solid rgba(181,88,58,.14);border-radius:18px 18px 0 0;padding:8px 6px calc(8px + env(safe-area-inset-bottom))}
nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:0.6875rem}
nav button svg{width:22px;height:22px}
nav button.on svg{filter:drop-shadow(0 0 6px rgba(181,88,58,.45))}
.cartbar-wrap{position:fixed;left:0;right:0;bottom:calc(74px + env(safe-area-inset-bottom));display:flex;justify-content:center;pointer-events:none;z-index:5}
.cartbar{pointer-events:auto;width:calc(100% - 32px);max-width:398px;background:var(--gold);color:#ffffff;border:0;border-radius:14px;padding:13px 16px;font-weight:600;font-size:0.9375rem;font-family:inherit;display:flex;justify-content:space-between;align-items:center;box-shadow:0 8px 22px rgba(181,88,58,.3);cursor:pointer}
.badge{display:inline-block;min-width:24px;padding:0 8px;border-radius:999px;background:var(--gold);color:#ffffff;font-size:0.8125rem;font-weight:700;line-height:24px;text-align:center}

.modal-bg{position:fixed;inset:0;background:rgba(43,33,26,.6);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:24px;z-index:50;opacity:0;transition:opacity .16s}
.modal-bg.buka{opacity:1}
.modal{width:100%;max-width:340px;background:linear-gradient(180deg,#ffffff,#ffffff);border:1px solid rgba(181,88,58,.22);border-radius:22px;padding:22px 20px 18px;box-shadow:0 24px 60px rgba(90,60,30,.22);transform:translateY(12px) scale(.98);transition:transform .18s}
.modal-bg.buka .modal{transform:none}
.modal-ikon{width:44px;height:44px;border-radius:50%;background:rgba(181,88,58,.14);color:var(--gold);display:flex;align-items:center;justify-content:center;font-size:1.375rem;font-weight:700;margin-bottom:12px}
.modal-ikon.bahaya{background:rgba(138,59,37,.16);color:var(--warn)}
.modal h3{font-size:1.1875rem;margin-bottom:6px}
.modal p{color:var(--muted);font-size:0.875rem;margin:0 0 18px;line-height:1.5}
.modal-aksi{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal-aksi .btn{box-shadow:none}
.btn.bahaya{background:var(--warn);color:#ffffff}

.modal-bg.sheetbg{align-items:flex-end;padding:0}
.sheet2{width:100%;max-width:430px;margin:0 auto;background:linear-gradient(180deg,#ffffff,#ffffff);border-radius:24px 24px 0 0;padding:10px 20px calc(18px + env(safe-area-inset-bottom));border-top:1px solid rgba(181,88,58,.2);transform:translateY(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.modal-bg.buka .sheet2{transform:none}
.handle2{width:42px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 14px}
.sheet2 h3{font-size:1.1875rem;margin-bottom:6px}
.sheet2 p{color:var(--muted);font-size:0.875rem;margin:0 0 6px;line-height:1.5}
.geser{position:relative;height:56px;border-radius:999px;background:#ffffff;border:1px solid rgba(138,59,37,.35);overflow:hidden;user-select:none;touch-action:none;margin-top:16px}
.geser-teks{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:0.875rem;pointer-events:none;padding-left:40px}
.geser-isi{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(138,59,37,.18)}
.geser-kenop{position:absolute;left:4px;top:4px;width:48px;height:48px;border-radius:50%;background:var(--warn);color:#ffffff;display:flex;align-items:center;justify-content:center;cursor:grab;box-shadow:0 4px 12px rgba(90,60,30,.16)}
.geser-kenop svg{color:#ffffff}
.geser.ok{border-color:var(--gold)}
.geser.ok .geser-isi{background:rgba(181,88,58,.2)}
.geser.ok .geser-teks{color:var(--gold)}
.undo-toast{position:fixed;left:50%;bottom:86px;transform:translate(-50%,160%);width:calc(100% - 32px);max-width:398px;background:#ffffff;border:1px solid rgba(181,88,58,.22);border-radius:16px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 14px 34px rgba(90,60,30,.22);transition:transform .25s cubic-bezier(.2,.8,.2,1);z-index:60;overflow:hidden}
.undo-toast.buka{transform:translate(-50%,0)}
.undo-toast span{font-size:0.875rem}
.undo-toast button{background:none;border:0;color:var(--gold);font-weight:600;font-family:inherit;font-size:0.875rem;cursor:pointer;padding:6px 4px}
.undo-toast .bar{position:absolute;left:0;bottom:0;height:3px;background:var(--gold);width:100%}
.undo-toast.jalan .bar{animation:habis5 5s linear forwards}
@keyframes habis5{from{width:100%}to{width:0}}
.batal-chip{color:var(--warn)}
.seg{display:flex;background:#efe6d8;border-radius:16px;padding:4px;gap:4px;margin:10px 0}
.seg button{flex:1 1 0;min-width:0;border:0;background:transparent;border-radius:12px;padding:10px 4px;font:inherit;font-size:.875rem;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg button.on{background:#ffffff;color:var(--gold);box-shadow:0 2px 8px rgba(90,60,30,.14)}
.chips{display:flex;gap:8px;overflow-x:auto;margin:10px -16px;padding:4px 16px 8px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid #d9cdbb;background:#ffffff;color:var(--muted);border-radius:999px;padding:9px 16px;font:inherit;font-size:.875rem;font-weight:600;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--gold);border-color:var(--gold);color:#ffffff}
.chip-n{display:inline-block;margin-left:4px;padding:0 6px;border-radius:999px;background:rgba(122,107,93,.14);font-size:.75rem;line-height:1.5;font-weight:700}
.chip.on .chip-n{background:rgba(255,255,255,.25)}
.menu-grid{gap:8px}
.menu-kartu{padding:12px 12px 10px}
.menu-nama{display:block;font-size:.9375rem;line-height:1.25}
.menu-harga{font-size:.8125rem;margin-top:2px}
.menu-tambah{margin-top:6px;padding:7px 10px;font-size:.8125rem}
</style></head>
<body>
<div id="app"></div>
<nav id="nav" class="hidden"></nav>
<div id="toast"></div>
<script src="./config.js"></script>
<script>
const KEY="arista_pos_v1";
const SUPABASE_URL=((window.ARISTA_CONFIG||{}).url||"").trim().replace(/\/rest\/v1\/?$/,"").replace(/\/$/,""),SUPABASE_ANON_KEY=((window.ARISTA_CONFIG||{}).anonKey||"").trim();
const newId=()=>crypto.randomUUID?crypto.randomUUID():"xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g,c=>{const r=Math.random()*16|0;return (c==="x"?r:(r&3|8)).toString(16)});
const $=id=>document.getElementById(id);
const rp=n=>"Rp "+Math.round(Number(n)||0).toLocaleString("id-ID");
const today=()=>new Date().toLocaleDateString("sv-SE");
function seed(){return{session:null,products:[
{id:"p1",name:"Espresso",cat:"Kopi",price:18000,cost:null,stock:50},
{id:"p2",name:"Americano",cat:"Kopi",price:20000,cost:null,stock:50},
{id:"p3",name:"Latte",cat:"Kopi",price:25000,cost:null,stock:50},
{id:"p4",name:"Cappuccino",cat:"Kopi",price:25000,cost:null,stock:50},
{id:"p5",name:"Caramel Latte",cat:"Kopi",price:28000,cost:null,stock:50},
{id:"p6",name:"Matcha Latte",cat:"Non Kopi",price:26000,cost:null,stock:50}],
sales:[],outbox:[],menuDirty:[],menuPull:"",menuSeeded:false,pesanan:[],shift:null,shiftRiwayat:[]}}
function load(){
  let raw=null;try{raw=localStorage.getItem(KEY)}catch(e){}
  if(raw===null)return seed();
  try{const r=JSON.parse(raw);if(r&&Array.isArray(r.products)&&Array.isArray(r.sales)&&Array.isArray(r.outbox))return Object.assign(seed(),r)}catch(e){}
  try{localStorage.setItem(KEY+"_rusak_"+Date.now(),raw)}catch(e){}
  return seed();
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast("Penyimpanan penuh. Ekspor backup sebelum melanjutkan.")}}
let S=load(),V=S.session?"beranda":"login",CAT="Semua",CART=[],PAY="Tunai",RANGE="Harian",LAST=null;
const OLD_KEY="arista_coffee_v1",MIG_KEY="arista_pos_migrasi_v1",BACKUP_KEY="arista_pos_backup_terakhir_v1";
function catFromOld(c){c=String(c||"");if(/non|tea|teh|matcha|choc|coklat|cokelat/i.test(c))return"Non Kopi";if(/makan|food|snack/i.test(c))return"Makanan";return"Kopi"}
function hhmm(v){const d=new Date(v);return isNaN(d)?"":d.toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit"})}
function convertOld(o){
  const products=(o.products||[]).map(p=>({id:String(p.id||newId()),name:String(p.name||"Tanpa nama"),cat:catFromOld(p.category),price:Number(p.price)||0,cost:p.cost==null||p.cost===""?null:Number(p.cost),stock:99}));
  const sales=(o.sales||[]).map(s=>({id:String(s.id||newId()),date:s.date||String(s.createdAt||s.time||"").slice(0,10),time:hhmm(s.createdAt||s.time),items:(s.items||[]).map(x=>({id:String(x.id||""),name:String(x.name||""),price:Number(x.price)||0,cost:x.cost==null?null:Number(x.cost),qty:Number(x.qty)||1})),total:Number(s.total)||0,method:s.method||"Tunai",paid:Number(s.paid)||0,change:Number(s.change)||0,cashier:"Migrasi (versi lama)"}));
  return{products,sales};
}
function isNewBackup(o){return Array.isArray(o.products)&&o.products.every(p=>"cat" in p)}
function migrasiLama(){
  if(S.sales.length||localStorage.getItem(MIG_KEY))return false;
  let raw=null;try{raw=localStorage.getItem(OLD_KEY)}catch(e){return false}
  if(!raw)return false;
  try{const o=JSON.parse(raw);if(!Array.isArray(o.products)||!Array.isArray(o.sales))return false;const c=convertOld(o);if(c.products.length)S.products=c.products;S.sales=c.sales;localStorage.setItem(MIG_KEY,new Date().toISOString());save();return true}catch(e){return false}
}
async function unduhLaporanRapi(){
  const e2=v=>esc(v==null?"":String(v));
  const rp2=v=>"Rp "+Math.round(Number(v)||0).toLocaleString("id-ID");
  const aktif=S.sales.filter(x=>!x.batal);
  const total=aktif.reduce((n,x)=>n+(Number(x.total)||0),0);
  const qris=aktif.filter(x=>x.method==="QRIS").reduce((n,x)=>n+(Number(x.total)||0),0);
  const piutang=aktif.filter(x=>x.method==="Piutang").reduce((n,x)=>n+(Number(x.total)||0),0);
  let belanja=0,catatanBelanja="";
  try{
    const tok=await tokenBaru();if(!tok)throw new Error("sesi");
    const r=await fetch(SUPABASE_URL+"/rest/v1/expenses?select=total&limit=10000",{headers:{apikey:SUPABASE_ANON_KEY,Authorization:"Bearer "+tok}});
    if(!r.ok)throw new Error("HTTP "+r.status);
    belanja=(await r.json()).reduce((n,x)=>n+(Number(x.total)||0),0);
  }catch(err){catatanBelanja="Belanja tidak bisa diambil karena tidak ada koneksi. Unduh lagi saat online agar total bersih lengkap."}
  const bersih=total-qris-belanja;
  const trRows=[...S.sales].filter(x=>!x.batal).sort((a,b)=>(b.ts||0)-(a.ts||0)).map(x=>`<tr><td>${e2(x.date)}</td><td>${e2(x.time)}</td><td>${e2(x.customer||"Umum")}</td><td>${e2(x.cashier)}</td><td>${e2(x.method)}</td><td class="r">${rp2(x.total)}</td></tr>`).join("");
  const html=`<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Laporan ARISTA ${today()}</title><style>body{font-family:Arial,Helvetica,sans-serif;color:#2b211a;margin:16px;font-size:14px}h1{font-size:20px;margin:0}h2{font-size:16px;margin:22px 0 8px;border-bottom:2px solid #b5583a;padding-bottom:4px}.info{color:#7a6b5d;margin-top:4px}table{width:100%;border-collapse:collapse;font-size:13px}th{background:#f3e2d8;text-align:left;padding:7px 6px}td{padding:6px;border-bottom:1px solid #e6dccd;vertical-align:top}.r{text-align:right;white-space:nowrap}.batal td{color:#9a8f80;text-decoration:line-through}.hitung{margin-top:12px;border:1px solid #e6dccd;border-radius:12px;overflow:hidden}.hitung div{display:flex;justify-content:space-between;padding:9px 14px;border-bottom:1px solid #e6dccd}.hitung div:last-child{border-bottom:0;background:#f3e2d8;font-weight:700;font-size:16px}.catat{color:#7a6b5d;font-size:12px;margin-top:8px}@media print{body{margin:8mm}}.kasir-banner{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 14px;border-radius:14px;margin:8px 0 12px;font-size:.875rem}
.kasir-banner.buka{background:#efe6d8;color:#2b211a;border-left:4px solid var(--gold)}
.kasir-banner.tutup{background:#f3e2d8;color:#8a3b25}
.menu-kunci{font-size:.8125rem;margin-top:6px}
</style></head><body>
<h1>ARISTA Coffee · Laporan</h1><div class="info">Dibuat ${new Date().toLocaleString("id-ID")} · Data dari tanggal ${today()}</div>
<h2>Ringkasan</h2>
<div class="hitung"><div><span>Total penjualan</span><span>${rp2(total)}</span></div><div><span>Dikurangi QRIS</span><span>− ${rp2(qris)}</span></div><div><span>Dikurangi belanja</span><span>− ${rp2(belanja)}</span></div><div><span>Total bersih</span><span>${rp2(bersih)}</span></div></div>
${catatanBelanja?`<div class="catat">${e2(catatanBelanja)}</div>`:""}
${piutang>0?`<div class="catat">Termasuk piutang ${rp2(piutang)} yang belum dibayar.</div>`:""}
<h2>Transaksi</h2><table><tr><th>Tanggal</th><th>Jam</th><th>Customer</th><th>Kasir</th><th>Metode</th><th class="r">Total</th></tr>${trRows||'<tr><td colspan="6">Belum ada transaksi.</td></tr>'}</table>
</body></html>`;
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([html],{type:"text/html;charset=utf-8"}));a.download="arista-laporan-"+today()+".html";document.body.appendChild(a);a.click();a.remove();
  toast("Laporan rapi diunduh. Buka di Chrome atau cetak.");
}
function unduhBackup(){
  const data={app:"arista-pos",versi:1,dibuat:new Date().toISOString(),products:S.products,sales:S.sales};
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:"application/json"}));a.download="arista-backup-"+today()+".json";document.body.appendChild(a);a.click();a.remove();
  try{localStorage.setItem(BACKUP_KEY,String(Date.now()))}catch(e){}
  toast("Backup diunduh. Simpan file ini di tempat aman.");render();
}
function pulihkanBackup(file){
  if(!file)return;
  const fr=new FileReader();
  fr.onload=async()=>{
    let o;try{o=JSON.parse(fr.result)}catch(e){toast("File backup tidak valid");return}
    let data;
    if(isNewBackup(o)&&Array.isArray(o.sales))data={products:o.products,sales:o.sales};
    else if(Array.isArray(o.products)&&Array.isArray(o.sales))data=convertOld(o);
    else{toast("Format backup tidak sesuai");return}
    if(!await tanyaSheet("Pulihkan backup","Data saat ini akan diganti dengan isi backup ("+data.sales.length+" transaksi).",{ya:"Pulihkan",bahaya:true}))return;
    if(data.products.length)S.products=data.products;
    S.sales=data.sales;save();toast("Backup dipulihkan: "+data.sales.length+" transaksi");render();
  };
  fr.readAsText(file);
}
const UUID_RE=/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
async function uuidDari(teks){const b=new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(teks))).slice(0,16);b[6]=(b[6]&0x0f)|0x50;b[8]=(b[8]&0x3f)|0x80;const h=[...b].map(x=>x.toString(16).padStart(2,"0")).join("");return h.slice(0,8)+"-"+h.slice(8,12)+"-"+h.slice(12,16)+"-"+h.slice(16,20)+"-"+h.slice(20)}
async function kirimRiwayatLama(){
  const lama=S.sales.filter(s=>!UUID_RE.test(String(s.id)));
  if(!lama.length)return toast("Tidak ada riwayat lama yang perlu dikirim.");
  if(!SUPABASE_URL||!navigator.onLine)return toast("Perlu internet untuk mengirim riwayat lama.");

function toRow(s){return{id:s.id,sale_date:s.date,sale_time:s.time,items:s.items,total:s.total,method:s.method,paid:s.paid,change_amount:s.change,cashier_name:s.cashier,customer:s.customer||"Umum",diskon:s.diskon||0}}
async function syncMenu(tok){
  const H={apikey:SUPABASE_ANON_KEY,Authorization:"Bearer "+tok};
  if(S.session&&S.session.role==="Pemilik"){
    if(!S.menuSeeded){
      const c=await fetch(SUPABASE_URL+"/rest/v1/products?select=id&limit=1",{headers:H}).then(r=>r.json());
      if(Array.isArray(c)&&c.length===0)S.menuDirty=S.products.map(p=>p.id);
      S.menuSeeded=true;save();
    }
    const dirty=[...new Set(S.menuDirty)];
    if(dirty.length){
      const rows=dirty.map(id=>{const p=S.products.find(x=>x.id===id);return p?{id,name:p.name,cat:p.cat,price:p.price,cost:p.cost,stock:Number(p.stock)||0,deleted:false}:{id,name:"-",cat:"-",price:0,cost:null,stock:0,deleted:true}});
      const r=await fetch(SUPABASE_URL+"/rest/v1/products?on_conflict=id",{method:"POST",headers:{...H,"Content-Type":"application/json",Prefer:"resolution=merge-duplicates,return=minimal"},body:JSON.stringify(rows)});
      if(!r.ok)throw new Error("menu HTTP "+r.status);
      S.menuDirty=S.menuDirty.filter(id=>!dirty.includes(id));save();
    }
  }
  const since=S.menuPull?"&updated_at=gt."+encodeURIComponent(S.menuPull):"";
  const r=await fetch(SUPABASE_URL+"/rest/v1/products?select=id,name,cat,price,cost,stock,deleted,updated_at&order=updated_at.asc"+since,{headers:H});
  if(!r.ok)throw new Error("menu pull HTTP "+r.status);
  for(const x of await r.json()){
    if(S.menuDirty.includes(x.id))continue;
    if(x.deleted)S.products=S.products.filter(p=>p.id!==x.id);
    else{
      const p=S.products.find(q=>q.id===x.id);
      if(p){p.name=x.name;p.cat=x.cat;p.price=Number(x.price);p.cost=x.cost==null?null:Number(x.cost);p.stock=Number(x.stock)||0}
      else S.products.push({id:x.id,name:x.name,cat:x.cat,price:Number(x.price),cost:x.cost==null?null:Number(x.cost),stock:Number(x.stock)||0});
    }
    S.menuPull=x.updated_at;
  }
  save();
}
async function syncNow(){
  if(!SUPABASE_URL||!navigator.onLine)return;
  if(syncing){syncPerlu=true;return}
  syncing=true;
  try{
    const tok=await tokenBaru();
    if(!tok)throw new Error("sesi");
    try{await syncMenu(tok)}catch(e){toast("Menu belum tersinkron. Dicoba lagi nanti.")}
    let terkirim=false;
    while(S.outbox.length){
      const sale=S.outbox[0];
      const res=await fetch(SUPABASE_URL+"/rest/v1/rpc/catat_penjualan",{method:"POST",headers:{apikey:SUPABASE_ANON_KEY,Authorization:"Bearer "+tok,"Content-Type":"application/json"},body:JSON.stringify({p_sale:toRow(sale)})});
      if(!res.ok)throw new Error("HTTP "+res.status);
      S.outbox.shift();save();terkirim=true;
    }
    if(terkirim){S.menuPull="";try{await syncMenu(tok)}catch(e){}}
  }catch(e){toast(e.message==="sesi"?"Sesi habis. Keluar lalu masuk lagi saat online.":"Sinkron gagal. Transaksi tetap aman dan akan dicoba lagi.")}
  finally{syncing=false;render();if(syncPerlu){syncPerlu=false;syncNow()}}
}

async function muatPiutang(){
  const req=++PIUT_REQ;
  try{
    const tok=await tokenBaru();if(!tok)throw new Error("sesi");
    const H={apikey:SUPABASE_ANON_KEY,Authorization:"Bearer "+tok};
    const [sr,pr]=await Promise.all([
      fetch(SUPABASE_URL+"/rest/v1/sales?select=id,sale_date,sale_time,customer,items,total,batal&method=eq.Piutang&order=sale_date.asc,created_at.asc&limit=2000",{headers:H}),
      fetch(SUPABASE_URL+"/rest/v1/pembayaran?select=sale_id,nominal,tanggal,metode&order=tanggal.asc&limit=5000",{headers:H})
    ]);
    if(!sr.ok||!pr.ok)throw new Error("HTTP");
    const sales=(await sr.json()).filter(x=>!x.batal);const bayar=await pr.json();
    if(req!==PIUT_REQ)return;
    PIUT_BAYAR=bayar.map(x=>({...x,nominal:Number(x.nominal)||0}));
    PIUT=sales.map(x=>{const dibayar=PIUT_BAYAR.filter(b=>b.sale_id===x.id).reduce((n,b)=>n+b.nominal,0);return {id:x.id,tanggal:x.sale_date,jam:x.sale_time||"",customer:x.customer||"Umum",items:x.items||[],total:Number(x.total)||0,dibayar,sisa:(Number(x.total)||0)-dibayar}}).filter(x=>x.sisa>0);
  }catch(e){if(req!==PIUT_REQ)return;PIUT=[];PIUT_BAYAR=[];LAP_NOTE="Piutang belum bisa dimuat. Periksa koneksi."}
  if(V==="laporan")render();
}

async function simpanPengeluaran(){
  const err=m=>{const el=$("xErr");if(el)el.textContent=m};
  const nama=$("xNama").value.trim(),kat=$("xKat").value.trim()||"Lainnya",tgl=$("xTgl").value||today(),qty=Number($("xQty").value),harga=Number($("xHarga").value),catatan=$("xCatatan").value.trim();
  if(!nama)return err("Nama pengeluaran wajib diisi.");
  if(!(qty>0))return err("Jumlah harus lebih dari 0.");
  if(!(harga>=0))return err("Harga tidak valid.");
  if(!navigator.onLine||!SUPABASE_URL)return err("Perlu internet untuk menyimpan pengeluaran.");
  try{
    const tok=await tokenBaru();if(!tok)throw new Error("sesi");
    const r=await fetch(SUPABASE_URL+"/rest/v1/expenses",{method:"POST",headers:{apikey:SUPABASE_ANON_KEY,Authorization:"Bearer "+tok,"Content-Type":"application/json",Prefer:"return=minimal"},body:JSON.stringify({tanggal:tgl,nama,kategori:kat,qty,harga,total:Math.round(qty*harga),catatan:catatan||null})});
    if(!r.ok)throw new Error("HTTP "+r.status);
    toast("Pengeluaran disimpan");muatPengeluaran();
  }catch(e){err("Gagal menyimpan. Coba lagi.")}

function tanyaInput(judul,pesan,{ya="Simpan",placeholder=""}={}){
  return new Promise(res=>{
    const bg=document.createElement("div");bg.className="modal-bg sheetbg";
    bg.innerHTML=`<div class="sheet2" role="dialog" aria-modal="true"><div class="handle2"></div><h3>${esc(judul)}</h3><p>${esc(pesan)}</p><input id="tiAlasan" placeholder="${esc(placeholder)}" style="margin-top:12px"><button class="btn bahaya" data-v="1" style="margin-top:12px">${esc(ya)}</button><button class="btn ghost" data-v="0" style="margin-top:10px">Batal</button></div>`;
    const kunci=e=>{if(e.key==="Escape")tutup(null)};
    const tutup=v=>{document.removeEventListener("keydown",kunci);bg.classList.remove("buka");setTimeout(()=>bg.remove(),250);res(v)};
    bg.addEventListener("click",e=>{const v=e.target.getAttribute&&e.target.getAttribute("data-v");if(v==="1")tutup(($("tiAlasan").value||"").trim()||"Dibatalkan Pemilik");else if(v==="0"||e.target===bg)tutup(null)});
    document.addEventListener("keydown",kunci);
    document.body.appendChild(bg);requestAnimationFrame(()=>bg.classList.add("buka"));
    setTimeout(()=>{const i=document.getElementById("tiAlasan");if(i)i.focus()},300);
  });
}
async function batalkanTransaksi(){
  const s=DETAIL;if(!s||S.session.role!=="Pemilik"||s.batal)return;
  if(S.outbox.some(x=>x.id===s.id))return toast("Transaksi ini belum terkirim. Tunggu sinkron dulu.");
  const alasan=await tanyaInput("Batalkan transaksi","Stok menu akan dikembalikan. Tulis alasannya.",{ya:"Batalkan",placeholder:"Contoh: salah input menu"});
  if(alasan===null)return;
  try{
    const tok=await tokenBaru();if(!tok)throw new Error("sesi");
    const r=await fetch(SUPABASE_URL+"/rest/v1/rpc/batalkan_penjualan",{method:"POST",headers:{apikey:SUPABASE_ANON_KEY,Authorization:"Bearer "+tok,"Content-Type":"application/json"},body:JSON.stringify({p_id:s.id,p_alasan:alasan})});
    if(!r.ok)throw new Error("HTTP "+r.status);
    const ok=await r.json();
    if(!ok){toast("Transaksi ini sudah dibatalkan sebelumnya.");return}
    for(const lst of [LAP,BER,S.sales]){if(!lst)continue;const x=lst.find(y=>y.id===s.id);if(x){x.batal=true;x.alasan_batal=alasan}}
    s.batal=true;s.alasan_batal=alasan;
    S.menuPull="";await syncMenu(tok).catch(()=>{});
    save();toast("Transaksi dibatalkan. Stok dikembalikan.");render();
  }catch(e){toast("Gagal membatalkan transaksi. Coba lagi saat online.")}
}

function eksporCsv(jenis){
  const kutip=v=>{const t=String(v==null?"":v);return /[";\n]/.test(t)?'"'+t.replace(/"/g,'""')+'"':t};
  let baris,nama;
  if(jenis==="penjualan"){
    const semua=LAP||S.sales.filter(s=>inRange(s.date,RANGE));
    baris=[["Tanggal","Jam","Customer","Kasir","Metode","Item","Diskon","Total","Bayar","Kembalian","Status","Alasan batal"]].concat(semua.map(s=>[s.date,s.time,s.customer||"Umum",s.cashier||"",s.method,(s.items||[]).map(i=>i.name+" x"+i.qty).join(" | "),s.diskon||0,s.total,s.paid,s.change,s.batal?"Dibatalkan":"Aktif",s.alasan_batal||""]));
    nama="penjualan";
  }else{
    baris=[["Tanggal","Nama","Kategori","Jumlah","Harga satuan","Total","Catatan"]].concat((EXP||[]).map(x=>[x.tanggal,x.nama,x.kategori||"",x.qty,x.harga,x.total,x.catatan||""]));
    nama="pengeluaran";
  }
  const isi="\uFEFF"+baris.map(r=>r.map(kutip).join(";")).join("\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([isi],{type:"text/csv;charset=utf-8"}));a.download="arista-"+nama+"-"+RANGE.toLowerCase()+"-"+today()+".csv";document.body.appendChild(a);a.click();a.remove();
  toast("File CSV diunduh");
}

let PENGGUNA=null,PENGGUNA_ERR="",PENGGUNA_REQ=0;
async function panggilKelola(body){
  if(!navigator.onLine)throw new Error("Perlu internet untuk mengelola pengguna.");
  const tok=await tokenBaru();if(!tok)throw new Error("Sesi habis. Keluar lalu masuk lagi saat online.");
  const r=await fetch(SUPABASE_URL+"/functions/v1/kelola-kasir",{method:"POST",headers:{apikey:SUPABASE_ANON_KEY,Authorization:"Bearer "+tok,"Content-Type":"application/json"},body:JSON.stringify(body)});
  const d=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(d.error||"Gagal ("+r.status+")");
  return d;
}

async function kirimLupa(){

  if(!SUPABASE_URL)return err("Server belum terhubung.");

  try{

  return new Promise(res=>{
    const bg=document.createElement("div");bg.className="modal-bg";
    bg.innerHTML=`<div class="modal" role="dialog" aria-modal="true"><div class="modal-ikon ${bahaya?"bahaya":""}">${bahaya?"!":"?"}</div><h3>${esc(judul)}</h3><p>${esc(pesan)}</p><div class="modal-aksi"><button class="btn ghost" data-v="0">${esc(batal)}</button><button class="btn ${bahaya?"bahaya":""}" data-v="1">${esc(ya)}</button></div></div>`;
    const kunci=e=>{if(e.key==="Escape")tutup(false)};
    const tutup=v=>{document.removeEventListener("keydown",kunci);bg.classList.remove("buka");setTimeout(()=>bg.remove(),160);res(v)};
    bg.addEventListener("click",e=>{const v=e.target.getAttribute&&e.target.getAttribute("data-v");if(v==="1")tutup(true);else if(v==="0"||e.target===bg)tutup(false)});
    document.addEventListener("keydown",kunci);
    document.body.appendChild(bg);requestAnimationFrame(()=>bg.classList.add("buka"));
    bg.querySelector('[data-v="1"]').focus();
  });
}

function tanyaGeser(judul,pesan,{ya="Hapus"}={}){
  return new Promise(res=>{
    const bg=document.createElement("div");bg.className="modal-bg";
    bg.innerHTML=`<div class="modal" role="dialog" aria-modal="true"><div class="modal-ikon bahaya">!</div><h3>${esc(judul)}</h3><p>${esc(pesan)}</p><div class="geser"><div class="geser-isi"></div><div class="geser-teks">Geser untuk ${esc(ya.toLowerCase())}</div><div class="geser-kenop"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></div></div><button class="btn ghost" data-v="0" style="margin-top:14px">Batal</button></div>`;
    const knob=bg.querySelector(".geser-kenop"),track=bg.querySelector(".geser"),isi=bg.querySelector(".geser-isi"),teks=bg.querySelector(".geser-teks");
    let drag=false,sx=0,start=4,selesai=false;
    const maks=()=>track.clientWidth-knob.offsetWidth-4;
    const kunci=e=>{if(e.key==="Escape")tutup(false)};
    const tutup=v=>{document.removeEventListener("keydown",kunci);bg.classList.remove("buka");setTimeout(()=>bg.remove(),160);res(v)};
    knob.addEventListener("pointerdown",e=>{if(selesai)return;drag=true;sx=e.clientX;start=parseFloat(knob.style.left)||4;knob.setPointerCapture(e.pointerId)});
    knob.addEventListener("pointermove",e=>{if(!drag)return;const x=Math.max(4,Math.min(maks(),start+(e.clientX-sx)));knob.style.left=x+"px";isi.style.width=(x+knob.offsetWidth)+"px"});
    knob.addEventListener("pointerup",()=>{if(!drag)return;drag=false;const x=parseFloat(knob.style.left)||4;if(x>=maks()*0.9){selesai=true;knob.style.left=maks()+"px";isi.style.width="100%";track.classList.add("ok");teks.textContent=ya;setTimeout(()=>tutup(true),300)}else{knob.style.left="4px";isi.style.width="0"}});
    bg.addEventListener("click",e=>{const v=e.target.getAttribute&&e.target.getAttribute("data-v");if(v==="0"||e.target===bg)tutup(false)});
    document.addEventListener("keydown",kunci);
    document.body.appendChild(bg);requestAnimationFrame(()=>bg.classList.add("buka"));
  });
}
let undoTimer=null;
function toastUndo(pesan,onUndo){
  let el=document.getElementById("undoToast");
  if(!el){el=document.createElement("div");el.id="undoToast";el.className="undo-toast";document.body.appendChild(el)}
  el.innerHTML=`<span>${esc(pesan)}</span><button>Batalkan</button><div class="bar"></div>`;
  el.classList.remove("buka","jalan");void el.offsetWidth;el.classList.add("buka","jalan");
  el.querySelector("button").onclick=()=>{clearTimeout(undoTimer);el.classList.remove("buka","jalan");onUndo()};
  clearTimeout(undoTimer);undoTimer=setTimeout(()=>el.classList.remove("buka","jalan"),5000);
}
function penjualanSejak(t){return S.sales.filter(x=>!x.batal&&(x.ts||0)>=t)}
function ringkasShift(sh){const list=penjualanSejak(sh.buka);const tunai=list.filter(x=>x.method==="Tunai").reduce((n,x)=>n+x.total,0);const semua=list.reduce((n,x)=>n+x.total,0);return{tunai,semua,jumlah:list.length,kasSeharusnya:sh.saldoAwal+tunai}}
function selisihLabel(v){return v===0?"Pas":(v>0?"Lebih "+rp(v):"Kurang "+rp(-v))}
function jam(t){return new Date(t).toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit"})}
function shiftCard(){const sh=S.shift;return sh?`<button class="card" style="width:100%;text-align:left;margin-top:12px;border-color:var(--gold);color:var(--cream);font-family:inherit;font-size:0.9375rem;cursor:pointer" onclick="go('shift')"><div class="row"><div><strong>Kasir sedang buka</strong><div class="muted">Sejak ${jam(sh.buka)} · ketuk untuk tutup kasir</div></div><span class="pill">Buka</span></div></button>`:`<button class="card" style="width:100%;text-align:left;margin-top:12px;font-family:inherit;font-size:0.9375rem;cursor:pointer;color:var(--cream)" onclick="go('shift')"><div class="row"><div><strong>Kasir belum dibuka</strong><div class="muted">Ketuk untuk membuka kasir dan isi uang awal</div></div><span class="muted">›</span></div></button>`}
function shiftView(){
  const sh=S.shift;
  const aktif=!sh?`<div class="card"><h3>Kasir belum dibuka</h3><p class="muted">Isi uang awal di laci, lalu buka kasir.</p><label class="muted">Uang awal di laci</label><input id="saldoAwal" type="number" inputmode="numeric" placeholder="Contoh: 200000" style="margin:8px 0 12px"><button class="btn" onclick="bukaShift()">Buka kasir</button></div>`:(()=>{const r=ringkasShift(sh);return `<div class="card"><div class="row"><h3>Kasir sedang buka</h3><span class="pill">Buka</span></div><div class="muted" style="margin-top:6px">Sejak ${jam(sh.buka)} · ${esc(sh.kasir)}</div><div class="row" style="margin-top:12px"><span class="muted">Uang awal</span><span>${rp(sh.saldoAwal)}</span></div><div class="row" style="margin-top:6px"><span class="muted">Penjualan tunai</span><span>${rp(r.tunai)}</span></div><div class="row" style="margin-top:6px"><span class="muted">Semua penjualan (${r.jumlah} transaksi)</span><span>${rp(r.semua)}</span></div><div class="row" style="margin-top:10px;border-top:1px solid var(--line);padding-top:10px"><strong>Kas seharusnya di laci</strong><strong>${rp(r.kasSeharusnya)}</strong></div><label class="muted" style="display:block;margin-top:16px">Uang yang dihitung sekarang</label><input id="saldoAkhir" type="number" inputmode="numeric" placeholder="Contoh: 218000" style="margin:8px 0 12px"><button class="btn" onclick="tutupShift()">Tutup kasir</button></div>`})();
  const daftar=(S.shiftRiwayat||[]).map(x=>`<button class="card" style="width:100%;text-align:left;margin-bottom:8px;font-family:inherit;color:var(--cream);cursor:pointer" onclick="bukaRiwayatShift('${x.id}')"><div class="row"><div><strong>${esc(x.kasir)}</strong><div class="muted">${new Date(x.buka).toLocaleDateString("id-ID")} · ${jam(x.buka)} – ${jam(x.tutup)}</div></div><strong>${selisihLabel(x.selisih)}</strong></div><div class="muted" style="margin-top:6px">Seharusnya ${rp(x.kasSeharusnya)} · dihitung ${rp(x.saldoAkhir)}</div><div class="muted" style="margin-top:6px;color:var(--gold)">Ketuk untuk lihat ${x.transaksi?x.transaksi.length+" transaksi":"rincian"}</div></button>`).join("");
  return `<button class="link" onclick="go('beranda')">← Kembali</button><h2>Kasir</h2>${aktif}<h3 style="margin:18px 0 8px">Riwayat tutup kasir</h3>${daftar||'<div class="muted">Belum ada riwayat di HP ini.</div>'}`;
}
let SHIFT_DETAIL=null;
function bukaRiwayatShift(id){SHIFT_DETAIL=(S.shiftRiwayat||[]).find(x=>x.id===id)||null;if(SHIFT_DETAIL)go("shiftDetail")}
function shiftDetailView(){
  const r=SHIFT_DETAIL;if(!r)return shiftView();
  const tr=r.transaksi;
  const baris=!tr?'<div class="muted">Rincian transaksi tidak tersimpan untuk tutup kasir ini.</div>':(tr.length?tr.map(x=>`<div class="card" style="margin-bottom:8px;${x.batal?"opacity:.6":""}"><div class="row"><div><strong>${esc(x.customer)}</strong><div class="muted">${esc(x.time)} · ${esc(x.method)}${x.batal?' · <span style="color:var(--warn)">dibatalkan</span>':""}</div><div class="muted" style="margin-top:4px">${(x.items||[]).map(i=>esc(i.name)+" x"+i.qty).join(", ")}</div></div><div style="text-align:right"><strong>${rp(x.total)}</strong>${x.diskon?`<div class="muted">diskon -${rp(x.diskon)}</div>`:""}</div></div></div>`).join(""):'<div class="muted">Tidak ada transaksi pada kasir ini.</div>');
  const aktif=tr?tr.filter(x=>!x.batal):[];
  const totalAktif=aktif.reduce((n,x)=>n+x.total,0);
  return `<button class="link" onclick="go('shift')">← Riwayat kasir</button><h2>Tutup kasir</h2>
<div class="card" style="margin:12px 0"><div class="row"><strong>${esc(r.kasir)}</strong><span class="muted">${new Date(r.buka).toLocaleDateString("id-ID")}</span></div><div class="muted" style="margin-top:4px">${jam(r.buka)} – ${jam(r.tutup)}</div>
<div class="row" style="margin-top:12px"><span class="muted">Uang awal</span><span>${rp(r.saldoAwal)}</span></div><div class="row" style="margin-top:6px"><span class="muted">Penjualan tunai</span><span>${rp(r.tunai)}</span></div><div class="row" style="margin-top:6px"><span class="muted">Kas seharusnya</span><span>${rp(r.kasSeharusnya)}</span></div><div class="row" style="margin-top:6px"><span class="muted">Uang dihitung</span><span>${rp(r.saldoAkhir)}</span></div><div class="row" style="margin-top:10px;border-top:1px solid var(--line);padding-top:10px"><strong>Selisih</strong><strong>${selisihLabel(r.selisih)}</strong></div></div>
<h3 style="margin:16px 0 8px">Transaksi${tr?" ("+tr.length+")":""}</h3>${baris}
${tr?`<div class="row" style="margin-top:12px;border-top:1px solid var(--line);padding-top:10px"><span class="muted">Total semua transaksi aktif</span><strong>${rp(totalAktif)}</strong></div>`:""}`;
}
function bukaShift(){
  const v=$("saldoAwal").value;
  if(v==="")return toast("Isi uang awal di laci");
  const n=Math.round(Number(v));if(!(n>=0))return toast("Uang awal tidak valid");
  S.shift={id:newId(),buka:Date.now(),saldoAwal:n,kasir:S.session.name};save();toast("Kasir dibuka");render();
}
function tutupShift(){
  const sh=S.shift;if(!sh)return;
  const v=$("saldoAkhir").value;
  if(v==="")return toast("Isi jumlah uang yang dihitung");
  const akhir=Math.round(Number(v));if(!(akhir>=0))return toast("Jumlah tidak valid");
  const r=ringkasShift(sh);
  const transaksi=S.sales.filter(x=>(x.ts||0)>=sh.buka).map(x=>({id:x.id,customer:x.customer||"Umum",time:x.time||"",method:x.method||"",total:x.total,diskon:x.diskon||0,batal:!!x.batal,items:(x.items||[]).map(i=>({name:i.name,qty:i.qty,price:i.price}))}));
  S.shiftRiwayat=[{id:sh.id,kasir:sh.kasir,buka:sh.buka,tutup:Date.now(),saldoAwal:sh.saldoAwal,tunai:r.tunai,semua:r.semua,jumlah:r.jumlah,kasSeharusnya:r.kasSeharusnya,saldoAkhir:akhir,selisih:akhir-r.kasSeharusnya,transaksi}].concat(S.shiftRiwayat||[]).slice(0,30);
  S.shift=null;save();toast("Kasir ditutup. "+selisihLabel(akhir-r.kasSeharusnya));render();
}
function kasirBuka(){return !!S.shift}
function bannerKasir(){const sh=S.shift;return sh?`<div class="kasir-banner buka"><span>Kasir sedang buka, sejak ${jam(sh.buka)}</span></div>`:`<div class="kasir-banner tutup"><span>Kasir belum dibuka. Buka kasir dulu untuk mulai menjual.</span><button class="link" onclick="go('shift')">Buka kasir</button></div>`}
function render(){
  const logged=!!S.session&&!RECOVERY;
  if(!logged&&SPLASH){$("app").innerHTML=`<div class="splash">${ICON.cup}<h1>ARISTA</h1><div class="muted">Coffee &amp; Roastery</div><div class="muted" style="margin-top:14px;font-size:0.75rem">Good Coffee · Better Moments</div></div>`;$("nav").classList.add("hidden");setTimeout(()=>{SPLASH=false;render()},1300);return}
  if(!logged&&!["login","lupa","pulih"].includes(V))V="login";
  const simpanIsi={};document.querySelectorAll("#app input[id]").forEach(i=>{simpanIsi[i.id]=i.value});
  $("app").innerHTML=(logged?statusBar():"")+(VIEWS[V]||login_)();
  Object.keys(simpanIsi).forEach(id=>{const el=document.getElementById(id);if(el&&el.value!==simpanIsi[id])el.value=simpanIsi[id]});
  $("nav").classList.toggle("hidden",!logged);
  $("nav").innerHTML=logged?navHtml():"";
}
window.addEventListener("online",()=>{render();syncNow()});

if(migrasiLama())setTimeout(()=>toast("Menu dan transaksi dari versi lama sudah dipindahkan."),800);
if(S.session&&S.session.role==="Pemilik"&&S.sales.length&&Date.now()-Number(localStorage.getItem(BACKUP_KEY)||0)>7*864e5)setTimeout(()=>toast("Belum ada backup dalam 7 hari. Unduh backup di Kelola."),2500);
(function(){const h=new URLSearchParams(location.hash.slice(1));if(h.get("type")==="recovery"&&h.get("access_token")){RECOVERY={token:h.get("access_token")};V="pulih";history.replaceState(null,"",location.pathname+location.search)}})();
render();if(S.session&&V==="beranda")muatBeranda();setInterval(syncNow,60000);syncNow();
if("serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost"))window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
