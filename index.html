<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#171513">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon/icon-192.png">
<title>ARISTA POS - prototipe</title>
<style>
:root{--bg:#171513;--panel:#211e1a;--line:#3a332b;--gold:#c5a16a;--cream:#f4ede2;--muted:#9a8f80;--warn:#d9735b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--cream);font:15px/1.5 Inter,system-ui,-apple-system,sans-serif}
h1,h2,h3{font-family:"Libre Baskerville",Georgia,serif;font-weight:400;margin:0}
#app{max-width:430px;margin:0 auto;min-height:100vh;padding:14px 16px 96px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.btn{display:block;width:100%;background:var(--gold);color:#1b1712;border:0;border-radius:12px;padding:12px 16px;font-weight:600;font-size:15px;font-family:inherit;cursor:pointer}
.btn.ghost{background:transparent;color:var(--gold);border:1px solid var(--gold)}
.btn.sm{display:inline-block;width:auto;padding:6px 12px;font-size:13px}
input{width:100%;background:var(--panel);color:var(--cream);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font:inherit}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.muted{color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tabs{display:flex;gap:6px;overflow-x:auto;flex-wrap:wrap}
.tab{padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);font:inherit;font-size:13px;white-space:nowrap;cursor:pointer}
.tab.on{background:var(--gold);color:#1b1712;border-color:var(--gold)}
#status{position:sticky;top:0;z-index:5;margin:-14px -16px 12px;padding:8px 16px;font-size:13px;background:#2a241d;border-bottom:1px solid var(--line)}
#status.off{color:var(--warn)}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:#1d1a16;border-top:1px solid var(--line);display:flex;padding:6px 0 calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;background:none;border:0;color:var(--muted);font:inherit;font-size:12px;padding:6px 0;cursor:pointer}
nav button.on{color:var(--gold)}
.receipt{background:#f4ede2;color:#171513;border-radius:6px;padding:14px;font:13px/1.6 ui-monospace,Menlo,monospace}
.hidden{display:none!important}
#toast{position:fixed;bottom:86px;left:50%;transform:translateX(-50%);background:var(--gold);color:#1b1712;padding:9px 14px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;text-align:center}
#toast.show{opacity:1}
@media print{body *{visibility:hidden}.receipt,.receipt *{visibility:visible}.receipt{position:absolute;left:0;top:0;width:80mm}}
</style></head>
<body>
<div id="app"></div>
<nav id="nav" class="hidden"></nav>
<div id="toast"></div>
<script src="./config.js"></script>
<script>
const KEY="arista_pos_v1";
const SUPABASE_URL=((window.ARISTA_CONFIG||{}).url||"").trim().replace(/\/rest\/v1\/?$/,"").replace(/\/$/,""),SUPABASE_ANON_KEY=((window.ARISTA_CONFIG||{}).anonKey||"").trim();
const newId=()=>crypto.randomUUID?crypto.randomUUID():"xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g,c=>{const r=Math.random()*16|0;return (c==="x"?r:(r&3|8)).toString(16)});
const $=id=>document.getElementById(id);
const rp=n=>"Rp "+Math.round(Number(n)||0).toLocaleString("id-ID");
const today=()=>new Date().toLocaleDateString("sv-SE");
function seed(){return{session:null,products:[
{id:"p1",name:"Espresso",cat:"Kopi",price:18000,cost:null,stock:50},
{id:"p2",name:"Americano",cat:"Kopi",price:20000,cost:null,stock:50},
{id:"p3",name:"Latte",cat:"Kopi",price:25000,cost:null,stock:50},
{id:"p4",name:"Cappuccino",cat:"Kopi",price:25000,cost:null,stock:50},
{id:"p5",name:"Caramel Latte",cat:"Kopi",price:28000,cost:null,stock:50},
{id:"p6",name:"Matcha Latte",cat:"Non Kopi",price:26000,cost:null,stock:50}],
sales:[],outbox:[],menuDirty:[],menuPull:"",menuSeeded:false}}
function load(){
  let raw=null;try{raw=localStorage.getItem(KEY)}catch(e){}
  if(raw===null)return seed();
  try{const r=JSON.parse(raw);if(r&&Array.isArray(r.products)&&Array.isArray(r.sales)&&Array.isArray(r.outbox))return Object.assign(seed(),r)}catch(e){}
  try{localStorage.setItem(KEY+"_rusak_"+Date.now(),raw)}catch(e){}
  return seed();
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast("Penyimpanan penuh. Ekspor backup sebelum melanjutkan.")}}
let S=load(),V=S.session?"beranda":"login",CAT="Semua",CART=[],PAY="Tunai",RANGE="Harian",LAST=null;
const OLD_KEY="arista_coffee_v1",MIG_KEY="arista_pos_migrasi_v1",BACKUP_KEY="arista_pos_backup_terakhir_v1";
function catFromOld(c){c=String(c||"");if(/non|tea|teh|matcha|choc|coklat|cokelat/i.test(c))return"Non Kopi";if(/makan|food|snack/i.test(c))return"Makanan";return"Kopi"}
function hhmm(v){const d=new Date(v);return isNaN(d)?"":d.toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit"})}
function convertOld(o){
  const products=(o.products||[]).map(p=>({id:String(p.id||newId()),name:String(p.name||"Tanpa nama"),cat:catFromOld(p.category),price:Number(p.price)||0,cost:p.cost==null||p.cost===""?null:Number(p.cost),stock:99}));
  const sales=(o.sales||[]).map(s=>({id:String(s.id||newId()),date:s.date||String(s.createdAt||s.time||"").slice(0,10),time:hhmm(s.createdAt||s.time),items:(s.items||[]).map(x=>({id:String(x.id||""),name:String(x.name||""),price:Number(x.price)||0,cost:x.cost==null?null:Number(x.cost),qty:Number(x.qty)||1})),total:Number(s.total)||0,method:s.method||"Tunai",paid:Number(s.paid)||0,change:Number(s.change)||0,cashier:"Migrasi (versi lama)"}));
  return{products,sales};
}
function isNewBackup(o){return Array.isArray(o.products)&&o.products.every(p=>"cat" in p)}
function migrasiLama(){
  if(S.sales.length||localStorage.getItem(MIG_KEY))return false;
  let raw=null;try{raw=localStorage.getItem(OLD_KEY)}catch(e){return false}
  if(!raw)return false;
  try{const o=JSON.parse(raw);if(!Array.isArray(o.products)||!Array.isArray(o.sales))return false;const c=convertOld(o);if(c.products.length)S.products=c.products;S.sales=c.sales;localStorage.setItem(MIG_KEY,new Date().toISOString());save();return true}catch(e){return false}
}
function unduhBackup(){
  const data={app:"arista-pos",versi:1,dibuat:new Date().toISOString(),products:S.products,sales:S.sales};
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:"application/json"}));a.download="arista-backup-"+today()+".json";document.body.appendChild(a);a.click();a.remove();
  try{localStorage.setItem(BACKUP_KEY,String(Date.now()))}catch(e){}
  toast("Backup diunduh. Simpan file ini di tempat aman.");render();
}
function pulihkanBackup(file){
  if(!file)return;
  const fr=new FileReader();
  fr.onload=()=>{
    let o;try{o=JSON.parse(fr.result)}catch(e){toast("File backup tidak valid");return}
    let data;
    if(isNewBackup(o)&&Array.isArray(o.sales))data={products:o.products,sales:o.sales};
    else if(Array.isArray(o.products)&&Array.isArray(o.sales))data=convertOld(o);
    else{toast("Format backup tidak sesuai");return}
    if(!confirm("Data saat ini akan diganti dengan isi backup ("+data.sales.length+" transaksi). Lanjutkan?"))return;
    if(data.products.length)S.products=data.products;
    S.sales=data.sales;save();toast("Backup dipulihkan: "+data.sales.length+" transaksi");render();
  };
  fr.readAsText(file);
}
function backupCard(){const ada=localStorage.getItem(BACKUP_KEY);
  return `<div class="card" style="margin:12px 0"><h3 style="margin-bottom:6px">Backup dan pemulihan</h3><div class="muted" style="margin-bottom:10px">${ada?"Backup terakhir: "+new Date(Number(ada)).toLocaleString("id-ID"):"Belum pernah diunduh."} Simpan file backup di tempat aman.</div><button class="btn" onclick="unduhBackup()">Unduh backup JSON</button><label class="btn ghost" style="display:block;text-align:center;margin-top:8px;cursor:pointer">Pulihkan backup<input type="file" accept=".json,application/json" onchange="pulihkanBackup(this.files[0]);this.value=''" style="display:none"></label></div>`}
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),2200)}
function go(v){V=v;if(v==="laporan"){LAP=null;LAP_NOTE="";render();muatLaporan()}else if(v==="beranda"){BER=null;BER_NOTE="";render();muatBeranda()}else render();window.scrollTo(0,0)}
function sumCart(){return CART.reduce((n,x)=>n+x.price*x.qty,0)}
function todaySales(){return S.sales.filter(s=>s.date===today())}
function inRange(d,m){const t=today();if(m==="Harian")return d===t;if(m==="Bulanan")return d.slice(0,7)===t.slice(0,7);const diff=(new Date(t+"T00:00")-new Date(d+"T00:00"))/864e5;return diff>=0&&diff<7}
async function masukAkun(){
  const email=$("em").value.trim(),pw=$("pw").value,err=m=>{$("lerr").textContent=m};
  if(!email||!pw)return err("Isi email dan kata sandi.");
  if(!SUPABASE_URL)return err("Server belum terhubung.");
  let a;
  try{
    const r=await fetch(SUPABASE_URL+"/auth/v1/token?grant_type=password",{method:"POST",headers:{apikey:SUPABASE_ANON_KEY,"Content-Type":"application/json"},body:JSON.stringify({email,password:pw})});
    if(!r.ok)return err("Email atau kata sandi salah.");
    a=await r.json();
  }catch(e){return err("Tidak bisa terhubung. Login pertama perlu internet.")}
  try{await simpanSesi(a);go("beranda");syncNow()}catch(e){err(e.message)}
}
async function simpanSesi(a){
  const uid=a.user.id;
  const r=await fetch(SUPABASE_URL+"/rest/v1/profiles?id=eq."+uid+"&select=nama,peran",{headers:{apikey:SUPABASE_ANON_KEY,Authorization:"Bearer "+a.access_token}});
  const rows=r.ok?await r.json():[];
  if(!rows.length)throw new Error("Akun ini belum punya profil peran.");
  S.session={name:rows[0].nama,role:rows[0].peran,uid,email:a.user.email,token:a.access_token,refresh:a.refresh_token,exp:Date.now()+(a.expires_in||3600)*1000};
  save();
}
async function tokenBaru(){
  if(!S.session||!S.session.token)return null;
  if(S.session.exp-Date.now()>60000)return S.session.token;
  if(!navigator.onLine)return null;
  const r=await fetch(SUPABASE_URL+"/auth/v1/token?grant_type=refresh_token",{method:"POST",headers:{apikey:SUPABASE_ANON_KEY,"Content-Type":"application/json"},body:JSON.stringify({refresh_token:S.session.refresh})});
  if(!r.ok)return null;
  const a=await r.json();
  S.session.token=a.access_token;S.session.refresh=a.refresh_token;S.session.exp=Date.now()+(a.expires_in||3600)*1000;save();
  return a.access_token;
}
function keluar(){if(!confirm("Keluar dari akun ini?"))return;S.session=null;CART=[];save();go("login")}
function addCart(id){const p=S.products.find(x=>x.id===id);const inCart=CART.find(x=>x.id===id);const q=inCart?inCart.qty:0;if(q>=p.stock){toast("Stok "+p.name+" habis");return}if(inCart)inCart.qty++;else CART.push({id:p.id,name:p.name,price:p.price,cost:p.cost,qty:1});toast(p.name+" ditambahkan");render()}
function chg(i,d){const x=CART[i];const p=S.products.find(y=>y.id===x.id);if(d>0&&x.qty>=p.stock){toast("Stok tidak cukup");return}x.qty+=d;if(x.qty<=0)CART.splice(i,1);render()}
function kembali(){const paid=Number($("paid").value)||0;$("kembali").textContent=rp(Math.max(0,paid-sumCart()))}
function bayarProses(){
  const tot=sumCart();if(!CART.length)return;
  const paid=PAY==="Tunai"?(Number($("paid").value)||0):tot;
  if(paid<tot){toast("Uang diterima belum mencukupi");return}
  for(const x of CART){const p=S.products.find(y=>y.id===x.id);if(p.stock<x.qty){toast("Stok "+x.name+" tidak cukup");return}}
  for(const x of CART)S.products.find(y=>y.id===x.id).stock-=x.qty;
  const sale={id:newId(),date:today(),time:new Date().toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit"}),items:CART.map(x=>({...x})),total:tot,method:PAY,paid,change:Math.max(0,paid-tot),cashier:S.session.name};
  S.sales.unshift(sale);S.outbox.push(sale);CART=[];save();LAST=sale;go("struk");toast("Transaksi tersimpan di perangkat");syncNow();
}
function selesai(){CART=[];go("menu")}
function tambahMenu(){
  const nm=$("nm").value.trim(),pr=Number($("pr").value),cs=$("cs").value,sk=Number($("sk").value)||0,ct=$("ct").value.trim()||"Lainnya";
  if(!nm){toast("Nama menu wajib diisi");return}
  if(!(pr>0)){toast("Harga harus lebih dari 0");return}
  const cost=cs===""?null:Number(cs);
  const nid="p"+Date.now();S.menuDirty.push(nid);S.products.push({id:nid,name:nm,cat:ct,price:pr,cost,stock:sk});
  save();toast("Menu tersimpan");render();syncNow();
}
function hapusMenu(id){if(!confirm("Hapus menu ini?"))return;S.products=S.products.filter(p=>p.id!==id);if(EDIT_ID===id)EDIT_ID=null;S.menuDirty.push(id);save();render();syncNow()}
let syncing=false;
function toRow(s){return{id:s.id,sale_date:s.date,sale_time:s.time,items:s.items,total:s.total,method:s.method,paid:s.paid,change_amount:s.change,cashier_name:s.cashier}}
async function syncMenu(tok){
  const H={apikey:SUPABASE_ANON_KEY,Authorization:"Bearer "+tok};
  if(S.session&&S.session.role==="Pemilik"){
    if(!S.menuSeeded){
      const c=await fetch(SUPABASE_URL+"/rest/v1/products?select=id&limit=1",{headers:H}).then(r=>r.json());
      if(Array.isArray(c)&&c.length===0)S.menuDirty=S.products.map(p=>p.id);
      S.menuSeeded=true;save();
    }
    const dirty=[...new Set(S.menuDirty)];
    if(dirty.length){
      const rows=dirty.map(id=>{const p=S.products.find(x=>x.id===id);return p?{id,name:p.name,cat:p.cat,price:p.price,cost:p.cost,deleted:false}:{id,name:"-",cat:"-",price:0,cost:null,deleted:true}});
      const r=await fetch(SUPABASE_URL+"/rest/v1/products?on_conflict=id",{method:"POST",headers:{...H,"Content-Type":"application/json",Prefer:"resolution=merge-duplicates,return=minimal"},body:JSON.stringify(rows)});
      if(!r.ok)throw new Error("menu HTTP "+r.status);
      S.menuDirty=S.menuDirty.filter(id=>!dirty.includes(id));save();
    }
  }
  const since=S.menuPull?"&updated_at=gt."+encodeURIComponent(S.menuPull):"";
  const r=await fetch(SUPABASE_URL+"/rest/v1/products?select=id,name,cat,price,cost,deleted,updated_at&order=updated_at.asc"+since,{headers:H});
  if(!r.ok)throw new Error("menu pull HTTP "+r.status);
  for(const x of await r.json()){
    if(S.menuDirty.includes(x.id))continue;
    if(x.deleted)S.products=S.products.filter(p=>p.id!==x.id);
    else{
      const p=S.products.find(q=>q.id===x.id);
      if(p){p.name=x.name;p.cat=x.cat;p.price=Number(x.price);p.cost=x.cost==null?null:Number(x.cost)}
      else S.products.push({id:x.id,name:x.name,cat:x.cat,price:Number(x.price),cost:x.cost==null?null:Number(x.cost),stock:99});
    }
    S.menuPull=x.updated_at;
  }
  save();
}
async function syncNow(){
  if(!SUPABASE_URL||syncing||!navigator.onLine)return;
  syncing=true;
  try{
    const tok=await tokenBaru();
    if(!tok)throw new Error("sesi");
    try{await syncMenu(tok)}catch(e){toast("Menu belum tersinkron. Dicoba lagi nanti.")}
    while(S.outbox.length){
      const sale=S.outbox[0];
      const res=await fetch(SUPABASE_URL+"/rest/v1/sales",{method:"POST",headers:{apikey:SUPABASE_ANON_KEY,Authorization:"Bearer "+tok,"Content-Type":"application/json",Prefer:"resolution=ignore-duplicates,return=minimal"},body:JSON.stringify(toRow(sale))});
      if(!res.ok)throw new Error("HTTP "+res.status);
      S.outbox.shift();save();
    }
  }catch(e){toast(e.message==="sesi"?"Sesi habis. Keluar lalu masuk lagi saat online.":"Sinkron gagal. Transaksi tetap aman dan akan dicoba lagi.")}
  finally{syncing=false;render()}
}
function saleRow(s){return `<div class="card row" style="margin-bottom:8px"><div><strong>${s.id.slice(0,8)}</strong><div class="muted">${s.time} · ${s.method}</div></div><strong>${rp(s.total)}</strong></div>`}
function statusBar(){const on=navigator.onLine;return `<div id="status" class="${on?"":"off"}">${on?"Online":"Offline: transaksi tetap aman di perangkat"} · ${S.outbox.length} menunggu sinkron${SUPABASE_URL?"":" · cloud belum dihubungkan"}</div>`}
function login_(){return `<div style="padding-top:56px;text-align:center"><h1 style="font-size:30px">ARISTA</h1><div class="muted">Coffee &amp; Roastery</div></div>
<div class="card" style="margin-top:28px"><h2>Masuk</h2>
<input id="em" type="email" placeholder="Email" autocomplete="username" style="margin:12px 0 8px">
<input id="pw" type="password" placeholder="Kata sandi" autocomplete="current-password">
<button class="btn" style="margin-top:12px" onclick="masukAkun()">Masuk</button>
<div id="lerr" class="muted" style="margin-top:8px;color:var(--warn);min-height:18px"></div></div>
<p class="muted" style="text-align:center;margin-top:14px">Login perlu internet. Setelah berhasil, kasir tetap bisa dipakai saat offline.</p>`}
let BER=null,BER_NOTE="",BER_REQ=0;
function petaTransaksi(x){return{id:x.id,date:x.sale_date,time:x.sale_time,items:x.items||[],total:Number(x.total)||0,method:x.method,paid:Number(x.paid)||0,change:Number(x.change_amount)||0,cashier:x.cashier_name}}
async function muatBeranda(){
  const req=++BER_REQ;const hari=today();
  if(!SUPABASE_URL||!navigator.onLine){BER=null;BER_NOTE=SUPABASE_URL?"Offline: menampilkan data di perangkat ini saja.":"";render();return}
  try{
    const tok=await tokenBaru();if(!tok)throw new Error("sesi");
    const r=await fetch(SUPABASE_URL+"/rest/v1/sales?select=id,sale_date,sale_time,items,total,method,paid,change_amount,cashier_name&sale_date=eq."+hari+"&order=created_at.desc&limit=500",{headers:{apikey:SUPABASE_ANON_KEY,Authorization:"Bearer "+tok}});
    if(!r.ok)throw new Error("HTTP "+r.status);
    const rows=await r.json();if(req!==BER_REQ)return;
    const cloud=rows.map(petaTransaksi);
    const ids=new Set(cloud.map(x=>x.id));
    BER=[...S.outbox.filter(x=>!ids.has(x.id)&&x.date===hari),...cloud];BER_NOTE="";
  }catch(e){if(req!==BER_REQ)return;BER=null;BER_NOTE="Tidak bisa memuat dari cloud. Menampilkan data di perangkat ini."}
  render();
}
function beranda(){
  const t=BER||todaySales();const omzet=t.reduce((n,s)=>n+s.total,0);
  const quick=[["Kasir","menu"],["Laporan","laporan"],...(S.session.role==="Pemilik"?[["Kelola","kelola"]]:[]),["Profil","profil"]];
  return `<h2>Selamat datang,<br>${S.session.name}</h2><div class="muted" style="margin:4px 0 14px">${S.session.role}</div>
${BER_NOTE?`<div class="muted" style="margin-bottom:8px;color:var(--warn)">${BER_NOTE}</div>`:""}
<div class="grid"><div class="card"><div class="muted">Total hari ini</div><h3>${rp(omzet)}</h3></div><div class="card"><div class="muted">Transaksi</div><h3>${t.length}</h3></div></div>
<div class="grid" style="margin-top:12px">${quick.map(([l,v])=>`<button class="btn ghost" onclick="go('${v}')">${l}</button>`).join("")}</div>
<h3 style="margin:18px 0 8px">Transaksi terbaru</h3>${t.slice(0,3).map(saleRow).join("")||'<div class="muted">Belum ada transaksi.</div>'}`}
function menu(){const cats=["Semua",...new Set(S.products.map(p=>p.cat))];const n=CART.reduce((a,x)=>a+x.qty,0);
  return `<h2>Menu</h2><div class="tabs" style="margin:10px 0">${cats.map(c=>`<button class="tab ${c===CAT?"on":""}" onclick="CAT='${c}';render()">${c}</button>`).join("")}</div>
<div class="grid">${S.products.filter(p=>CAT==="Semua"||p.cat===CAT).map(p=>`<div class="card"><strong>${p.name}</strong><div class="muted">${rp(p.price)} · stok ${p.stock}</div><button class="btn sm" style="margin-top:8px" onclick="addCart('${p.id}')">+ Tambah</button></div>`).join("")}</div>
<button class="btn" style="margin-top:14px" onclick="go('kasir')">Lihat keranjang (${n})</button>`}
function kasir(){const tot=sumCart();
  return `<h2>Keranjang</h2>${CART.length?CART.map((x,i)=>`<div class="card row" style="margin:8px 0"><div><strong>${x.name}</strong><div class="muted">${rp(x.price)}</div></div><div class="row"><button class="btn sm ghost" onclick="chg(${i},-1)">−</button><span>${x.qty}</span><button class="btn sm ghost" onclick="chg(${i},1)">+</button></div></div>`).join("")+`<div class="row" style="margin:14px 0"><span>Total</span><h3>${rp(tot)}</h3></div><button class="btn" onclick="go('bayar')">Bayar</button>`:'<div class="muted">Keranjang kosong.</div><button class="btn ghost" style="margin-top:12px" onclick="go(\'menu\')">Pilih menu</button>'}`}
function bayar(){const tot=sumCart();
  return `<h2>Pembayaran</h2><div class="card" style="margin:12px 0;text-align:center"><div class="muted">Total</div><h1>${rp(tot)}</h1></div>
<div class="tabs">${["Tunai","QRIS","Debit/Kredit","Transfer"].map(m=>`<button class="tab ${m===PAY?"on":""}" onclick="PAY='${m}';render()">${m}</button>`).join("")}</div>
${PAY==="Tunai"?`<label class="muted">Uang diterima</label><input id="paid" type="number" inputmode="numeric" oninput="kembali()" style="margin:6px 0 10px"><div class="row"><span>Kembalian</span><strong id="kembali">${rp(0)}</strong></div>`:`<p class="muted" style="margin-top:12px">Pembayaran ${PAY} dicatat manual.</p>`}
<button class="btn" style="margin-top:16px" onclick="bayarProses()">Proses Pembayaran</button><button class="btn ghost" style="margin-top:8px" onclick="go('kasir')">Batal</button>`}
function struk(){const s=LAST;if(!s)return beranda();
  return `<h2>Struk transaksi</h2><div class="receipt" style="margin:12px 0"><div style="text-align:center"><strong>ARISTA</strong><br>Coffee &amp; Roastery</div><hr>No. ${s.id.slice(0,8)}<br>${s.date} ${s.time}<br>Kasir: ${s.cashier}<hr>${s.items.map(x=>`${x.name} x${x.qty} &nbsp; ${rp(x.price*x.qty)}`).join("<br>")}<hr>Total ${rp(s.total)}<br>${s.method}${s.method==="Tunai"?`<br>Bayar ${rp(s.paid)} · Kembali ${rp(s.change)}`:""}</div>
<button class="btn" onclick="window.print()">Cetak struk</button><button class="btn ghost" style="margin-top:8px" onclick="selesai()">Selesai</button>`}
let LAP=null,LAP_NOTE="",LAP_REQ=0;
function rentangTanggal(m){const t=today();if(m==="Harian")return[t,t];if(m==="Bulanan")return[t.slice(0,8)+"01",t];const d=new Date(t+"T00:00");d.setDate(d.getDate()-6);return[d.toLocaleDateString("sv-SE"),t]}
async function muatLaporan(){
  const req=++LAP_REQ;const[dari,sampai]=rentangTanggal(RANGE);
  if(!SUPABASE_URL||!navigator.onLine){LAP=null;LAP_NOTE="Offline: menampilkan data di perangkat ini saja.";render();return}
  try{
    const tok=await tokenBaru();if(!tok)throw new Error("sesi");
    const url=SUPABASE_URL+"/rest/v1/sales?select=id,sale_date,sale_time,items,total,method,paid,change_amount,cashier_name&sale_date=gte."+dari+"&sale_date=lte."+sampai+"&order=sale_date.desc,created_at.desc&limit=1000";
    const r=await fetch(url,{headers:{apikey:SUPABASE_ANON_KEY,Authorization:"Bearer "+tok}});
    if(!r.ok)throw new Error("HTTP "+r.status);
    const rows=await r.json();if(req!==LAP_REQ)return;
    const cloud=rows.map(x=>({id:x.id,date:x.sale_date,time:x.sale_time,items:x.items||[],total:Number(x.total)||0,method:x.method,paid:Number(x.paid)||0,change:Number(x.change_amount)||0,cashier:x.cashier_name}));
    const ids=new Set(cloud.map(x=>x.id));
    const pending=S.outbox.filter(x=>!ids.has(x.id)&&x.date>=dari&&x.date<=sampai);
    LAP=[...pending,...cloud];LAP_NOTE="";
  }catch(e){if(req!==LAP_REQ)return;LAP=null;LAP_NOTE="Tidak bisa memuat dari cloud. Menampilkan data di perangkat ini."}
  render();
}
function laporan(){
  const list=LAP||S.sales.filter(s=>inRange(s.date,RANGE));
  const omzet=list.reduce((n,s)=>n+s.total,0);
  let cost=0,unknown=false;for(const s of list)for(const x of s.items){if(x.cost==null)unknown=true;else cost+=x.cost*x.qty}
  const margin=unknown?"–":rp(omzet-cost);
  return `<h2>Laporan</h2><div class="tabs" style="margin:10px 0">${["Harian","Mingguan","Bulanan"].map(m=>`<button class="tab ${m===RANGE?"on":""}" onclick="RANGE='${m}';LAP=null;render();muatLaporan()">${m}</button>`).join("")}</div>
${LAP_NOTE?`<div class="muted" style="margin-bottom:8px;color:var(--warn)">${LAP_NOTE}</div>`:""}
<div class="grid"><div class="card"><div class="muted">Total omzet</div><h3>${rp(omzet)}</h3></div><div class="card"><div class="muted">Transaksi</div><h3>${list.length}</h3></div></div>
${S.session.role==="Pemilik"?`<div class="card" style="margin-top:10px"><div class="muted">Margin kotor</div><h3>${margin}</h3><div class="muted">${unknown?"Isi harga modal di Kelola agar margin terhitung.":""}</div></div>`:""}
<h3 style="margin:18px 0 8px">Transaksi</h3>${list.slice(0,20).map(saleRow).join("")||'<div class="muted">Belum ada transaksi pada periode ini.</div>'}`}
let EDIT_ID=null;
const esc=v=>String(v==null?"":v).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");
function bukaEdit(id){EDIT_ID=id;render();window.scrollTo(0,0)}
function batalEdit(){EDIT_ID=null;render()}
function simpanEdit(){
  const p=S.products.find(x=>x.id===EDIT_ID);if(!p){EDIT_ID=null;return render()}
  const nm=$("ed_nm").value.trim(),pr=Number($("ed_pr").value),cs=$("ed_cs").value,ct=$("ed_ct").value.trim()||"Lainnya";
  if(!nm){toast("Nama menu wajib diisi");return}
  if(!(pr>0)){toast("Harga harus lebih dari 0");return}
  Object.assign(p,{name:nm,cat:ct,price:pr,cost:cs===""?null:Number(cs)});
  if(!S.menuDirty.includes(p.id))S.menuDirty.push(p.id);
  EDIT_ID=null;save();toast("Menu diperbarui");render();syncNow();
}
function editCard(){
  const ed=EDIT_ID&&S.products.find(p=>p.id===EDIT_ID);if(!ed)return "";
  return `<div class="card" style="margin:12px 0;border-color:var(--gold)"><h3 style="margin-bottom:8px">Edit menu</h3><input id="ed_nm" value="${esc(ed.name)}" placeholder="Nama menu"><div class="grid" style="margin-top:8px"><input id="ed_ct" value="${esc(ed.cat)}" placeholder="Kategori"><input id="ed_pr" type="number" value="${esc(ed.price)}" placeholder="Harga"></div><div class="grid" style="margin-top:8px"><input id="ed_cs" type="number" value="${esc(ed.cost)}" placeholder="Harga modal (opsional)"><button class="btn ghost" onclick="batalEdit()">Batal</button></div><button class="btn" style="margin-top:10px" onclick="simpanEdit()">Simpan perubahan</button></div>`;
}
function kelola(){
  if(S.session.role!=="Pemilik")return '<div class="muted">Halaman ini hanya untuk Pemilik.</div>';
  return `<h2>Kelola menu</h2>${backupCard()}${editCard()}<div class="card" style="margin:12px 0"><h3 style="margin-bottom:8px">Tambah menu</h3><input id="nm" placeholder="Nama menu"><div class="grid" style="margin-top:8px"><input id="ct" placeholder="Kategori: Kopi / Non Kopi / Makanan"><input id="pr" type="number" placeholder="Harga"></div><div class="grid" style="margin-top:8px"><input id="cs" type="number" placeholder="Harga modal (opsional)"><input id="sk" type="number" placeholder="Stok (hanya di perangkat ini)"></div><button class="btn" style="margin-top:10px" onclick="tambahMenu()">Simpan menu</button></div>
${S.products.map(p=>`<div class="card row" style="margin-bottom:8px"><div><strong>${esc(p.name)}</strong><div class="muted">${esc(p.cat)} · ${rp(p.price)} · stok ${p.stock}</div></div><div class="row" style="gap:6px"><button class="btn sm ghost" onclick="bukaEdit('${p.id}')">Edit</button><button class="btn sm ghost" onclick="hapusMenu('${p.id}')">Hapus</button></div></div>`).join("")}`;
}

function profil(){return `<h2>Profil</h2><div class="card" style="margin:12px 0"><strong>${S.session.name}</strong><div class="muted">${S.session.role}</div></div>
<div class="card"><div class="row"><span>Status</span><span>${navigator.onLine?"Online":"Offline"}</span></div><div class="row" style="margin-top:6px"><span>Menunggu sinkron</span><span>${S.outbox.length}</span></div><div class="muted" style="margin-top:8px">${SUPABASE_URL?"Terhubung ke cloud.":"Cloud belum dihubungkan. Data tersimpan di perangkat ini."}</div></div>
<button class="btn ghost" style="margin-top:14px" onclick="keluar()">Keluar dari akun</button>`}
const VIEWS={login:login_,beranda,menu,kasir,bayar,struk,laporan,kelola,profil};
function navHtml(){const items=S.session.role==="Pemilik"?[["beranda","Beranda"],["menu","Kasir"],["laporan","Laporan"],["kelola","Kelola"],["profil","Profil"]]:[["beranda","Beranda"],["menu","Kasir"],["laporan","Laporan"],["profil","Profil"]];
  const active=v=>V===v||(v==="menu"&&["kasir","bayar","struk"].includes(V));
  return items.map(([v,l])=>`<button class="${active(v)?"on":""}" onclick="go('${v}')">${l}</button>`).join("")}
function render(){
  const logged=!!S.session;
  if(!logged&&V!=="login")V="login";
  $("app").innerHTML=(logged?statusBar():"")+(VIEWS[V]||login_)();
  $("nav").classList.toggle("hidden",!logged);
  $("nav").innerHTML=logged?navHtml():"";
}
window.addEventListener("online",()=>{render();syncNow()});
window.addEventListener("offline",render);
if(migrasiLama())setTimeout(()=>toast("Menu dan transaksi dari versi lama sudah dipindahkan."),800);
if(S.session&&S.session.role==="Pemilik"&&S.sales.length&&Date.now()-Number(localStorage.getItem(BACKUP_KEY)||0)>7*864e5)setTimeout(()=>toast("Belum ada backup dalam 7 hari. Unduh backup di Kelola."),2500);
render();if(S.session&&V==="beranda")muatBeranda();setInterval(syncNow,60000);syncNow();
if("serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost"))window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
</script></body></html>
